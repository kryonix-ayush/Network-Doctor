services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: networkdoctor
      POSTGRES_USER: networkdoctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkdoctor -d networkdoctor"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - monitoring

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://networkdoctor:${POSTGRES_PASSWORD}@postgres:5432/networkdoctor
    command:
      - python
      - -m
      - uvicorn
      - backend.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=172.30.0.0/24
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  cloud-agent:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      AGENT_LOCATION: cloud
      AGENT_ID: network-doctor-cloud
      AGENT_NAME: Network Doctor Cloud Agent
      AGENT_TOKEN: ${CLOUD_AGENT_TOKEN:?Set CLOUD_AGENT_TOKEN in .env}
      API_BASE_URL: https://${NETWORK_DOCTOR_DOMAIN:?Set NETWORK_DOCTOR_DOMAIN in .env}
      DATABASE_URL: ""
      DATABASE_PATH: /data/cloud-agent.sqlite3
    command: ["python", "-m", "agents.cloud_agent"]
    volumes:
      - cloud_agent_data:/data
    networks:
      - monitoring

  dashboard:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: https://${NETWORK_DOCTOR_DOMAIN:?Set NETWORK_DOCTOR_DOMAIN in .env}
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
    command: ["python", "-m", "streamlit", "run", "dashboard/app.py"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitoring

  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      NETWORK_DOCTOR_DOMAIN: ${NETWORK_DOCTOR_DOMAIN:?Set NETWORK_DOCTOR_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    networks:
      - monitoring

volumes:
  postgres_data:
  cloud_agent_data:
  caddy_data:
  caddy_config:

networks:
  monitoring:
    ipam:
      config:
        - subnet: 172.30.0.0/24
